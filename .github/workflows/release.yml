name: Release

# Runs on every push to main. If there are pending changesets, it opens/updates
# a "Version Packages" PR. Once that PR is merged (a normal, reviewed PR — see
# branch protection), the changesets are gone and this workflow instead
# publishes the newly bumped packages to npm, the VS Code Marketplace, and
# Open VSX, then tags the release.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # for npm provenance

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package VS Code extension
        if: steps.changesets.outputs.published == 'true'
        run: |
          pnpm --filter dryguard-vscode build
          pnpm --filter dryguard-vscode package

      - name: Publish to VS Code Marketplace
        if: steps.changesets.outputs.published == 'true'
        run: pnpm --filter dryguard-vscode publish:vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: steps.changesets.outputs.published == 'true'
        run: pnpm --filter dryguard-vscode publish:openvsx
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
