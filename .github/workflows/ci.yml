name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  package-vsix:
    name: Package VS Code extension (smoke test)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dryguard-vscode build
      - run: pnpm --filter dryguard-vscode package
      - uses: actions/upload-artifact@v4
        with:
          name: dryguard-vsix
          path: packages/vscode-extension/dryguard.vsix
          retention-days: 7

  cli-self-scan:
    name: dryguard scan (dogfood smoke test)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dryguard/core --filter @dryguard/cli build
      # Informational for now (|| true): run this repo's own CLI against
      # itself so a broken `dryguard scan` fails loudly here rather than
      # being discovered by the first real user. Drop `|| true` once the
      # false-positive rate on this codebase has been tuned.
      - run: node packages/cli/dist/cli.js scan . --format markdown || true

  ci-success:
    name: CI
    runs-on: ubuntu-latest
    needs: [build-test, package-vsix, cli-self-scan]
    if: always()
    steps:
      - name: Require every CI job
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ] || [ "${{ needs.package-vsix.result }}" != "success" ] || [ "${{ needs.cli-self-scan.result }}" != "success" ]; then
            echo "build-test=${{ needs.build-test.result }} package-vsix=${{ needs.package-vsix.result }} cli-self-scan=${{ needs.cli-self-scan.result }}"
            exit 1
          fi
